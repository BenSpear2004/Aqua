name: bank-ai

services:
  backend:
    build: ./backend
    network_mode: host
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Production: nginx serves the built site on 5173 and forwards /api to
  # the backend. For local frontend work run `npm run dev` in frontend/.
  frontend:
    build: ./frontend
    network_mode: host
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
