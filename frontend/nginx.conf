# Production web server for aqua-ai.us: serves the built site and forwards
# /api to the backend on this machine. Listens on 5173, the port the dev
# server used, so whatever routes the domain here needs no change.
# HTTPS is terminated in front of this (Cloudflare or another proxy).

# Behind Cloudflare every request arrives from Cloudflare's address, so
# rate limits key on the visitor's address Cloudflare passes along.
map $http_cf_connecting_ip $aqua_client {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}

# Each question costs 20 to 80 seconds of model time; 10 a minute per
# visitor, with a burst of 5, is far above real use and stops floods.
limit_req_zone $aqua_client zone=aqua_query:10m rate=10r/m;
limit_req_status 429;

server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 16k;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Answers can take minutes when the model retries, so wait long.
    location = /api/query {
        limit_req zone=aqua_query burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 30s;
    }

    # Vite puts a content hash in every asset name, so they never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Single-page app: every other path is the app itself, never cached,
    # so a new deploy shows up on the next page load.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ /index.html;
    }
}
